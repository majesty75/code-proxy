services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data
    ports: ["4222:4222", "8222:8222"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_PASSWORD: uta
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ch_data:/var/lib/clickhouse
    ports: ["8123:8123", "9000:9000"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3005:3000"]
    depends_on: [clickhouse]

  decode_service:
    build:
      context: .
      dockerfile: services/decode_service/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      CH_HOST: clickhouse
      CH_PASS: uta
      LAYOUTS_DIR: /app/config/layouts
      VARIABLES_YAML: /app/config/variables.yaml
      UTA_SQLITE: ${UTA_SQLITE:-}            # mount + set to enable UTA lookup
    volumes:
      - ./config:/app/config:ro
    depends_on:
      clickhouse: {condition: service_healthy}
      nats: {condition: service_started}

  dump_agent:
    build:
      context: .
      dockerfile: services/dump_agent/Dockerfile
    environment:
      NATS_URL: nats://nats:4222
      WATCH_DIR: /dropzone
    volumes:
      - ./dropzone:/dropzone
    depends_on:
      nats: {condition: service_started}

volumes:
  nats_data:
  ch_data:
