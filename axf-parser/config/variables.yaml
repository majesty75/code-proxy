# Curated keys promoted to uta.axf_metrics for dashboards, per product+core.
# Everything else is still decoded and archived in axf_snapshots.decoded_json;
# a new key here can be backfilled from there with no schema change.
#
# Keys are the dotted leaf paths produced by core.flatten (variable.path.to.leaf).
# Start small (10-50); confirm exact paths per product with the FW team (OPEN-D).

# Demo product (RTEMS sample AXF) — real leaf paths from ticker-arm.elf.
RTEMS:
  M:
    - Configuration.microseconds_per_tick
    - Configuration.ticks_per_timeslice
    - Configuration_RTEMS_API.maximum_tasks
    - Configuration_RTEMS_API.maximum_semaphores
    - rtems_maximum_priority
    # per-field transform: raw bytes -> KiB, unit overridden
    - key: Configuration.work_space_size
      transform: kib
      unit: KiB
    # derived metrics computed from other fields (custom python in transforms.py)
    - derived: Configuration.work_space_kib
      transform: workspace_kib
      section: Configuration
    - derived: tick_frequency_hz
      transform: tick_hz
      section: Configuration

# Real products — fill curated SSD telemetry paths (placeholders).
SIRIUS:
  H:
    - smart.wai
    - smart.waf
    - ec.slc.max
    - ec.slc.avg
    - bad_block.init_bb
    - temp.case
    - io.total
